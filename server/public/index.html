<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>漂流瓶 · 中转服务</title>
<style>
  :root {
    --paper: #fdfaf2;
    --ink: #2f2a23;
    --muted: #8b8375;
    --line: #e2d8c7;
    --sea: #6b8f9c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, "Segoe UI", sans-serif;
    line-height: 1.9;
    padding: 28px;
  }
  .card {
    max-width: 32rem;
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 44px 40px 38px;
    background: rgba(255, 253, 247, .72);
  }
  .eyebrow {
    font-size: 11.5px;
    letter-spacing: .14em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  h1 {
    font-size: 25px;
    font-weight: 600;
    margin: 0 0 20px;
    letter-spacing: .01em;
  }
  p { margin: 0 0 15px; font-size: 14.5px; color: #4a4438; }
  .rule {
    height: 1px;
    background: var(--line);
    margin: 28px 0 24px;
    border: 0;
  }
  .hint {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
  }
  .surprise {
    margin-top: 26px;
    padding: 16px 18px;
    border-radius: 10px;
    background: rgba(107, 143, 156, .07);
    border: 1px solid rgba(107, 143, 156, .18);
    font-size: 13.5px;
    color: #4c6570;
  }
  .surprise b { color: var(--sea); font-weight: 600; }
  footer {
    margin-top: 30px;
    font-size: 11.5px;
    color: #b3aa9a;
  }
  code {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: .92em;
    background: rgba(0,0,0,.045);
    padding: 1px 5px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Message in a Bottle</div>

    <h1>漂流瓶 · 中转服务</h1>

    <p>这里是桌宠之间传递信件的中转站，<strong>不提供网页界面</strong>。</p>

    <p>你不需要在这里做任何事。桌宠客户端会自动连上来，
       信件的收发都在你自己的电脑上进行。</p>

    <hr class="rule">

    <p class="hint">
      如果你是不小心点进来的——这里确实没什么可看的。<br>
      海面之下才有东西。
    </p>

    <div class="surprise">
      <b>这里以后可能会有点惊喜。</b><br>
      现在先留一块空地。哪天你路过，也许会发现多了一样东西。
    </div>

    <footer>此服务仅用于 Cortico 桌宠的漂流瓶扩展。</footer>
  </main>
</body>
</html>
